<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="neutralDocBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDFA" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
    <linearGradient id="neutralDocCoat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="120" height="120" rx="24" fill="url(#neutralDocBg)" stroke="#CCFBF1" stroke-width="1.5" />

  <!-- Inner Subtle Ring -->
  <circle cx="60" cy="60" r="52" fill="none" stroke="#99F6E4" stroke-width="1" stroke-dasharray="2 3" opacity="0.6" />

  <!-- Doctor Silhouette Group -->
  <g id="doctor-neutral-silhouette">
    <!-- Shoulders & Torso (Doctor's Lab Coat) -->
    <path d="M23 110 C23 88, 39 80, 60 80 C81 80, 97 88, 97 110 Z" fill="#0F766E" />
    
    <!-- White Lab Coat Lapels / Inner Scrub -->
    <path d="M42 110 L50 82 L70 82 L78 110 Z" fill="url(#neutralDocCoat)" stroke="#CBD5E1" stroke-width="0.75" />
    <!-- V-Neck Scrub Inner -->
    <path d="M52 82 L60 96 L68 82 Z" fill="#0D9488" />

    <!-- Stethoscope around neck -->
    <path d="M48 83 C46 95, 48 103, 52 106" fill="none" stroke="#1E293B" stroke-width="2" stroke-linecap="round" />
    <path d="M72 83 C74 95, 72 101, 67 105" fill="none" stroke="#1E293B" stroke-width="2" stroke-linecap="round" />
    <circle cx="67" cy="106" r="3" fill="#0F766E" stroke="#1E293B" stroke-width="1.5" />

    <!-- Neck -->
    <path d="M52 64 L52 80 C55 83, 65 83, 68 80 L68 64 Z" fill="#0D9488" opacity="0.9" />

    <!-- Head / Face Silhouette -->
    <ellipse cx="60" cy="52" rx="15" ry="19" fill="#0F766E" />
  </g>
</svg>
